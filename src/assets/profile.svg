<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background studio warm beige gradient -->
    <linearGradient id="studio-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cfc3b5" />
      <stop offset="50%" stop-color="#baad9e" />
      <stop offset="100%" stop-color="#9d8f80" />
    </linearGradient>

    <!-- Studio Radial Spotlight -->
    <radialGradient id="spotlight" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f3e9dc" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#c4b5a3" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8c7e70" stop-opacity="0.6" />
    </radialGradient>

    <!-- Skin tone gradients -->
    <linearGradient id="skin-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e3a882" />
      <stop offset="50%" stop-color="#d4946d" />
      <stop offset="100%" stop-color="#b87853" />
    </linearGradient>

    <linearGradient id="skin-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a0603d" />
      <stop offset="100%" stop-color="#7a4427" />
    </linearGradient>

    <!-- White Henley Shirt Gradient -->
    <linearGradient id="henley-white" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <linearGradient id="henley-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Navy Trousers -->
    <linearGradient id="navy-pants" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Soft drop shadow filter -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#3a2e2b" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Studio Background -->
  <rect width="800" height="800" fill="url(#studio-bg)" />
  <rect width="800" height="800" fill="url(#spotlight)" />

  <g filter="url(#soft-shadow)">
    <!-- Navy Pants -->
    <path d="M 280,680 L 520,680 L 540,800 L 260,800 Z" fill="url(#navy-pants)" />
    <!-- Belt line -->
    <path d="M 290,680 Q 400,690 510,680 L 515,698 Q 400,708 285,698 Z" fill="#090d16" />

    <!-- Body / White Henley Short-Sleeve Shirt -->
    <!-- Torso -->
    <path d="M 240,420 Q 300,380 400,380 Q 500,380 560,420 L 540,685 Q 400,695 260,685 Z" fill="url(#henley-white)" />
    <!-- Left Sleeve -->
    <path d="M 240,420 L 200,530 L 275,545 L 290,440 Z" fill="url(#henley-white)" />
    <path d="M 200,520 L 275,535 L 273,545 L 198,530 Z" fill="url(#henley-shadow)" />
    <!-- Right Sleeve -->
    <path d="M 560,420 L 600,530 L 525,545 L 510,440 Z" fill="url(#henley-white)" />
    <path d="M 600,520 L 525,535 L 527,545 L 602,530 Z" fill="url(#henley-shadow)" />

    <!-- Henley Placket & Collar Detail -->
    <!-- Neck Opening -->
    <path d="M 345,385 Q 400,425 455,385 Q 430,375 400,375 Q 370,375 345,385 Z" fill="url(#skin-main)" />
    <!-- Collar Band -->
    <path d="M 340,380 Q 400,430 460,380 Q 465,390 455,395 Q 400,440 345,395 Q 335,390 340,380 Z" fill="url(#henley-shadow)" />
    <!-- Vertical Button Placket -->
    <path d="M 388,400 L 412,400 L 410,500 L 390,500 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <path d="M 408,400 L 412,400 L 410,500 L 406,500 Z" fill="url(#henley-shadow)" />
    <!-- Henley Buttons -->
    <circle cx="400" cy="420" r="3.5" fill="#94a3b8" />
    <circle cx="400" cy="445" r="3.5" fill="#94a3b8" />
    <circle cx="400" cy="470" r="3.5" fill="#94a3b8" />

    <!-- Arms & Clasped Hands Pose -->
    <!-- Left Forearm -->
    <path d="M 235,535 Q 320,530 380,520 L 385,555 Q 320,565 230,555 Z" fill="url(#skin-main)" />
    <!-- Right Forearm -->
    <path d="M 565,535 Q 480,530 420,520 L 415,555 Q 480,565 570,555 Z" fill="url(#skin-main)" />

    <!-- Clasped Hands at Center -->
    <path d="M 365,490 Q 400,480 435,490 Q 450,520 430,560 Q 400,575 370,560 Q 350,520 365,490 Z" fill="url(#skin-main)" />
    <!-- Finger overlays for clasped knuckles -->
    <path d="M 375,505 Q 400,495 425,505" stroke="#a0603d" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 372,520 Q 400,510 428,520" stroke="#a0603d" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 375,535 Q 400,525 425,535" stroke="#a0603d" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Neck -->
    <path d="M 355,310 L 445,310 L 452,390 Q 400,420 348,390 Z" fill="url(#skin-main)" />
    <!-- Neck shadow under jaw -->
    <path d="M 355,310 Q 400,345 445,310 Q 448,340 400,365 Q 352,340 355,310 Z" fill="url(#skin-shadow)" opacity="0.6" />

    <!-- Head & Face Structure -->
    <!-- Jaw and cheeks -->
    <path d="M 325,190 C 320,270 345,335 400,338 C 455,335 480,270 475,190 C 470,120 330,120 325,190 Z" fill="url(#skin-main)" />

    <!-- Ears -->
    <path d="M 318,200 C 305,200 308,245 328,245 Z" fill="url(#skin-main)" />
    <path d="M 482,200 C 495,200 492,245 472,245 Z" fill="url(#skin-main)" />

    <!-- Eyes (Looking straight ahead, confident) -->
    <!-- Left Eye -->
    <ellipse cx="365" cy="210" rx="14" ry="8" fill="#ffffff" />
    <ellipse cx="365" cy="210" rx="7" ry="7" fill="#3d2314" />
    <circle cx="363" cy="208" r="2.5" fill="#ffffff" />
    <path d="M 348,202 Q 365,196 382,202" stroke="#271509" stroke-width="3" fill="none" />

    <!-- Right Eye -->
    <ellipse cx="435" cy="210" rx="14" ry="8" fill="#ffffff" />
    <ellipse cx="435" cy="210" rx="7" ry="7" fill="#3d2314" />
    <circle cx="433" cy="208" r="2.5" fill="#ffffff" />
    <path d="M 418,202 Q 435,196 452,202" stroke="#271509" stroke-width="3" fill="none" />

    <!-- Eyebrows (Strong dark masculine brows) -->
    <path d="M 342,192 Q 365,182 388,188" stroke="#1c1917" stroke-width="5" fill="none" stroke-linecap="round" />
    <path d="M 412,188 Q 435,182 458,192" stroke="#1c1917" stroke-width="5" fill="none" stroke-linecap="round" />

    <!-- Nose -->
    <path d="M 400,200 L 393,248 L 407,248 Z" fill="url(#skin-shadow)" opacity="0.3" />
    <path d="M 388,252 Q 400,260 412,252" stroke="#90502a" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Lips / Subtle confident smile/calm expression -->
    <path d="M 372,282 Q 400,292 428,282" stroke="#9e5238" stroke-width="4" fill="none" stroke-linecap="round" />
    <path d="M 376,282 Q 400,280 424,282" stroke="#6e311e" stroke-width="2" fill="none" />

    <!-- Hair (Short dark curly hair fade matching photo) -->
    <path d="M 320,190 C 315,140 335,100 400,95 C 465,100 485,140 480,190 C 470,145 450,118 400,118 C 350,118 330,145 320,190 Z" fill="#1c1917" />
    <!-- Textured Curly Hair Top -->
    <path d="M 325,170 C 320,120 350,85 400,85 C 450,85 480,120 475,170 C 460,110 430,95 400,95 C 370,95 340,110 325,170 Z" fill="#09090b" />
    <!-- Curly bumps -->
    <circle cx="350" cy="105" r="14" fill="#1c1917" />
    <circle cx="375" cy="95" r="16" fill="#27272a" />
    <circle cx="400" cy="90" r="18" fill="#1c1917" />
    <circle cx="425" cy="95" r="16" fill="#27272a" />
    <circle cx="450" cy="105" r="14" fill="#1c1917" />
    <circle cx="335" cy="125" r="12" fill="#1c1917" />
    <circle cx="465" cy="125" r="12" fill="#1c1917" />
  </g>
</svg>
